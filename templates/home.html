
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Movie Recommendation System</title>

    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/css/autoComplete.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script>
        var films = {{ suggestions | tojson }};
    </script>
</head>

<body id="content" style="font-family: 'Noto Sans JP', sans-serif;">

    <div class="ml-container" style="display: block;">

        <div class="text-center">
            <h1>Movie Recommendation System</h1>
        </div>

        <div class="form-group shadow-textarea"
             style="margin-top: 30px; text-align: center; color: white;">

            <input
                type="text"
                name="movie"
                class="movie form-control"
                id="autoComplete"
                autocomplete="off"
                placeholder="Enter the Movie Name"
                style="background-color: #ffffff; border-color: #ffffff; width: 60%; color: #181818;"
                required
            >

            <br>
        </div>

        <div class="form-group text-center">
            <button
                type="button"
                class="btn btn-primary btn-block movie-button"
                style="background-color: #e50914; border-color: #e50914; width: 120px; margin: auto;"
                disabled
            >
                Enter
            </button>
            <br><br>
        </div>

    </div>

    <div class="fail" style="display: none;">
        <div class="text-center">
            <h3>Sorry! The requested movie is not in our database.</h3>
        </div>
    </div>

    <div class="results" style="display: none;">
        <div class="text-center">
            <h2 id="name" class="text-uppercase"></h2>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/js/autoComplete.min.js"></script>

    <script src="{{ url_for('static', filename='autocomplete.js') }}"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="{{ url_for('static', filename='recommend.js') }}"></script>

</body>
</html>
